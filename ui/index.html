<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPC UA 浏览器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="OPC UA" width="22" height="22" />
      <span>OPC UA 浏览器</span>
    </div>
    <div class="conn">
      <select id="connSelect" title="选择 OPC UA 连接"></select>
      <input id="connId" type="text" placeholder="连接 ID（手动）" title="宿主未暴露连接列表时手动填写" />
      <button id="useBtn">使用此连接</button>
      <span id="status" class="status">未连接</span>
    </div>
  </header>

  <main class="layout" id="layout">
    <!-- Left: address space tree (narrow, its width is draggable) -->
    <section class="tree-pane" id="treePane">
      <div class="pane-title">地址空间</div>
      <ul id="tree" class="tree"></ul>
    </section>

    <div class="splitter" id="splitLeft" role="separator" aria-orientation="vertical"
         tabindex="0" title="拖动调整宽度 · 双击复位"></div>

    <!-- Middle: drop target for points dragged out of the tree -->
    <section class="board-pane" id="boardPane">
      <div class="pane-title board-title">
        <span>点位区 <span id="watchCount" class="count">0</span></span>
        <div class="watch-ctl">
          <button id="pollBtn" title="按设定间隔轮询读取所有点位">▶ 持续观察</button>
          <select id="pollMs" title="轮询间隔">
            <option value="200">200 ms</option>
            <option value="500">500 ms</option>
            <option value="1000" selected>1 s</option>
            <option value="2000">2 s</option>
            <option value="5000">5 s</option>
          </select>
          <button id="clearWatch" class="ghost" title="移除全部点位">清空</button>
        </div>
      </div>
      <div id="watchList" class="watch-list"></div>
      <div id="dropHint" class="drop-hint">
        <div class="drop-hint-inner">
          <div class="drop-icon">⇢</div>
          <p>把左侧地址空间中的 <b>Variable</b> 点位拖到这里</p>
          <p class="hint">拖动后可在此持续观察数值，点击数值即可改写并下发。</p>
        </div>
      </div>
    </section>

    <div class="splitter" id="splitRight" role="separator" aria-orientation="vertical"
         tabindex="0" title="拖动调整宽度 · 双击复位"></div>

    <!-- Right: details of the selected point -->
    <section class="detail-pane" id="detailPane">
      <div class="pane-title">节点详情</div>
      <div id="detail" class="detail">
        <p class="hint">在左侧树或中间点位区选择一个点位查看详情。</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
