name: Release DBX plugin

# Two triggers on purpose:
#   * push of a v* tag  -> nobody created a Release yet, so `ensure-release` creates
#                          one; `git tag vX.Y.Z && git push origin vX.Y.Z` is then
#                          enough to publish a release and build the binaries.
#   * release published -> a Release was published by hand (UI or API).
#
# Why the first trigger was missing until now: this workflow only listened to
# `release: published`. GitHub treats a tag and a Release as two different
# objects -- pushing a tag never emits a release event, so tagging alone did
# nothing. Creating the Release *inside* this workflow (instead of relying on a
# second workflow reacting to it) also avoids the dead end where an event created
# with GITHUB_TOKEN fails to trigger further workflow runs.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ensure-release:
    # Skipped on the `release` path: the Release already exists there.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Create the Release for the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag: $TAG (repo: $REPO)"
          # `--repo` is required: this job does not check out the repository, and
          # `gh` otherwise tries to read the repo from the local git remote.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists -- reusing it."
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi

  release:
    # Multi-platform packaging is handled by the upstream reusable workflow: it
    # builds the native sidecar once per OS/arch and publishes one unsigned
    # .dbxp candidate per target.
    needs: ensure-release
    # `needs:` alone would skip this job when ensure-release is skipped (the
    # `release` path). The status check function keeps both paths alive.
    if: ${{ !cancelled() && !failure() }}
    # Pinned to a commit SHA, not a branch: reusable workflows run with the
    # caller's permissions, so a moving ref is a supply-chain risk. Note that
    # `plugin-sdk-v1` (the ref `dbx-plugin create` emits) does NOT exist upstream
    # -- neither a tag nor a branch -- and the run fails before building anything.
    # To upgrade: take the new SHA of t8y2/dbx main and re-run one release.
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@d030f4276f7922fbc2b0b844a20875991347ac79 # main @ 2026-10-21
    with:
      # `github.event.release` is empty on the tag-push path, hence the fallback.
      release-tag: ${{ github.event.release.tag_name || github.ref_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      # Pinned to the version this repository was actually packaged and verified with.
      plugin-cli-version: 0.1.9
      rust-toolchain: stable
      # No Go backend, so skip actions/setup-go entirely.
      go-version: ""
      # One runner per target. `dbx-plugin package` compiles the Rust sidecar
      # natively on the host and never cross-compiles, so a Windows runner can
      # only ever emit windows-x64; `--target` / DBX_PLUGIN_TARGET only labels
      # the artifact. Keep runner and target paired and delete any entry whose
      # runner your plan cannot allocate.
      build-matrix: >-
        {"include":[
        {"runner":"ubuntu-24.04","target":"linux-x64"},
        {"runner":"ubuntu-24.04-arm","target":"linux-arm64"},
        {"runner":"windows-2022","target":"windows-x64"},
        {"runner":"macos-15-intel","target":"darwin-x64"},
        {"runner":"macos-15","target":"darwin-arm64"}
        ]}
